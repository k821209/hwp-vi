[workspace]
members = ["crates/hwp-core", "crates/hwp-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/k821209/hwp-vi"

[workspace.dependencies]
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.9"
sha2       = "0.10"
cfb        = "0.15"
flate2     = "1"
zip        = { version = "9", default-features = false, features = ["deflate"] }
quick-xml  = "0.42"
unicode-width = "0.2"
# 코퍼스의 그림은 png·jpg·bmp 다. 기본 기능을 다 켜면 빌드가 무거워지므로
# 필요한 디코더만 켠다 (gif·webp 는 흔하니 같이).
image      = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
ratatui    = "0.30"
crossterm  = "0.29"
clap       = { version = "4", features = ["derive"] }
